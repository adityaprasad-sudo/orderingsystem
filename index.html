<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ordering system</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="topbar">
        <div class="searchbar">
            <input 
    type="text" 
    id="site-search" 
    name="q"
    placeholder=" 🔎︎ Search Products" 
    required
  >
        </div>
        <div class="somewidgets">
            <button class="widgetbtn"><img src="./assets/notification.png" width="15px" height="15px"/></button>
            <button class="widgetbtn"><img src="./assets/settings.png" width="15px" height="15px"/></button>
            <select class="selectdrop" >
                <option value="tb1">Table 1</option>
                <option value="tb2"> Table 2</option>
                <option value="tb3">Table 3</option>
                <option value="tb4">Table 4</option>
                <option value="tb5">Table 5</option>
                <option value="tb6">Table 6</option>
                <option value="tb7">Table 7</option>
                <option value="tb8">Table 8</option>
                <option value="tb9">Table 9</option>
                <option value="tb10">Table 10</option>
                </select>
            
        </div>
    </div>
    <div class="sidebarbg">
        
    </div>
    <div class="nav">
        <div class="navlogo">
            <img class="logo" src="./assets/logo.png" width="50px" height="50px"/>
        </div>
        <div class="seprator"></div>
        <div class="navbtn">
            <button class="navbtns" id="homebtn"> <img id="home" src="./assets/home.png" width="30px" height="30px"alt="home" /></button>
            <button class="navbtns" id ="aboutbtn"><img id="about" src="./assets/about.png" width="30px" height="30px"/></button>
            <button class="navbtns" id="feedbackbtn"><img id="feedback" src="./assets/feedback.png" width="30px" height="30px"/></button>
            <button class="navbtns" id="carebtn"><img id="care" src="./assets/care.png" width="30px" height="30px"/></button>
        </div>
    </div>
    <div class="rectanglepink">
        <div class="tabs">
            <div class="tabbtn">Order #2045<div class="cross">✖</div></div>
            <div class="tabbtn">Order #2046<div class="cross">✖</div></div>
        </div>
        <div class="filters">
            <button class="filterbtn">All</button>
            <button class="filterbtn">NonVeg</button>
            <button class="filterbtn">Veg</button>
            <button class="filterbtn">Beverages</button>
            <button class="filterbtn">Snacks</button>
            <button class="filterbtn">Desserts</button>
            <button class="filterbtn">Drinks</button>
            <button class="filterbtn">Breads</button>
        </div>
    </div>
<script>
  const homebtn = document.getElementById("homebtn")
  const img = document.getElementById("home")
  const aboutbtn = document.getElementById("aboutbtn")
  const feedbackbtn = document.getElementById("feedbackbtn")
  const carebtn = document.getElementById("carebtn")
  const aboutimg = document.getElementById("about")
  const feedbackimg = document.getElementById("feedback")
  const careimg = document.getElementById("care")
  homebtn.addEventListener('mouseover', () => {
    img.src = "./assets/homehov.png";
  });

  homebtn.addEventListener('mouseout', () => {
    img.src = "./assets/home.png";
  });

  aboutbtn.addEventListener('mouseover', () => {
    aboutimg.src = "./assets/abouthov.png";
  });

  aboutbtn.addEventListener('mouseout', () => {
    aboutimg.src = "./assets/about.png";
  });

  feedbackbtn.addEventListener('mouseover', () => {
    feedbackimg.src = "./assets/feedbackhov.png";
  });

  feedbackbtn.addEventListener('mouseout', () => {
    feedbackimg.src = "./assets/feedback.png";
  });

  carebtn.addEventListener('mouseover', () => {
    careimg.src = "./assets/carehov.png";
  });

  carebtn.addEventListener('mouseout', () => {
    careimg.src = "./assets/care.png";
  });
</script>
</body>
</html>
